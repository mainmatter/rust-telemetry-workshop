[workspace]
members = [
  "exercises/*/*",
  "helpers",
]
resolver = "1"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
fs-err = "3.3"
helpers = { path = "helpers" }
hyper = "1.10.1"
log = "0.4"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
metrics-util = "0.20.4"
opentelemetry = "0.32.0"
opentelemetry-otlp = "0.32.0"
opentelemetry_sdk = "0.32.1"
rustls = "0.23.40"
serde_json = "1"
tempfile = "3.27"
tokio = "1.52.3"
tonic = "0.14.6"
tracing = "0.1"
tracing-log = "0.2"
tracing-opentelemetry = "0.33.0"
tracing-panic = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
ureq = "3"
